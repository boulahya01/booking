# Supabase configuration for UNEEM V2.
# Non-secret Auth settings are versioned here so hosted configuration can be
# reviewed before `supabase config push`. SMTP credentials must stay outside Git.
project_id = "uneem"

[api]
# Port to use for the API server. Default is 54321.
port = 54321
# Schemas to expose in the API.
schemas = ["public", "storage", "graphql_public"]
# Default number of rows returned when limit is not specified.
max_rows = 1000

[db]
# Port to use for the local database. Default is 54322.
port = 54322
# Keep local Postgres aligned with the hosted major version used by V2.
major_version = 17

[studio]
# Port to use for the local Studio server.
port = 54323

[inbucket]
# Local email testing server.
port = 54324
smtp_port = 54325

[storage]
# 50 MiB local storage ceiling. Application-level student-card validation is
# intentionally stricter and remains enforced separately.
file_size_limit = 52428800

[auth]
enabled = true
site_url = "https://www.uneem.site"
additional_redirect_urls = [
  "https://www.uneem.site/verify-email",
  "https://www.uneem.site/reset-password",
  "https://uneem.site/verify-email",
  "https://uneem.site/reset-password",
  "https://*-marwaneboulahya-5125s-projects.vercel.app/**",
  "http://localhost:5173/verify-email",
  "http://localhost:5173/reset-password"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your UNEEM email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your UNEEM password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
# UNEEM launch authentication is email/password only.
enable_signup = false
enable_confirmations = false
