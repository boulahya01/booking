name: Audit Arabic UI copy

on:
  push:
    branches: [fix/msa-arabic-full-app]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/msa-arabic-full-app
      - name: Extract Arabic UI strings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('frontend/src')]
          allow = {'.svelte','.ts','.js','.json'}
          arabic = re.compile(r'[\u0600-\u06FF]')
          quote_pat = re.compile(r"(['\"`])((?:\\.|(?!\1).)*?[\u0600-\u06FF](?:\\.|(?!\1).)*?)\1", re.S)
          lines=[]
          for root in roots:
            for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in allow:
                continue
              text=p.read_text(encoding='utf-8', errors='ignore')
              matches=[]
              for m in quote_pat.finditer(text):
                value=' '.join(m.group(2).split())
                if arabic.search(value): matches.append(value)
              if matches:
                lines.append(f'## {p.as_posix()}')
                for v in sorted(set(matches)):
                  lines.append(v)
                lines.append('')
          Path('arabic-audit.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add arabic-audit.txt
          git commit -m "Audit Arabic UI copy" || exit 0
          git push
