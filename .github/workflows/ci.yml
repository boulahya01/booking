name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - 'v2/**'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Fictional browser configuration; e2e tests intercept all backend requests.
      VITE_SUPABASE_URL: https://test-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_fixture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Release hygiene guard
        run: node scripts/release-hygiene.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Svelte and TypeScript checks
        working-directory: frontend
        run: npm run check

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for auth routing smoke
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile regression tests
        working-directory: frontend
        run: npx playwright test --workers=1
