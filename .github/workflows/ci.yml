name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - 'v2/**'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Release hygiene guard
        run: node scripts/release-hygiene.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Svelte and TypeScript checks
        working-directory: frontend
        run: npm run check

      - name: Production build
        working-directory: frontend
        run: npm run build
