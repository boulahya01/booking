name: Finalize Modern Standard Arabic UI

on:
  push:
    branches: [fix/msa-arabic-full-app]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/msa-arabic-full-app
      - name: Fix remaining copy and verify dialect tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path('frontend/src/routes/(app)/admin/pitches/+page.svelte')
          text = target.read_text(encoding='utf-8')
          text = text.replace(
            "يمكن للمرفق يبقى مفتوح بعد منتصف الليل، مثلا 08:00 → 01:00.",
            "يمكن أن يبقى المرفق مفتوحاً بعد منتصف الليل، مثلاً 08:00 → 01:00."
          )
          text = text.replace("إبقاءه نشطاً", "إبقاؤه نشطاً")
          target.write_text(text, encoding='utf-8')

          tokens = [
            'واش','شنو','راه','بغيت','ديال','ديالك','دابا','غادي','تقدر','حيت','واخا','مزال',
            'هادي','هادا','هادشي','بهاد','باش','كاين','ماشي','ماتش','بلايص','صحاب','دبّر','عاود',
            'خليه','خرجتي','غيبقى','كيبدا','تسد','نهضرو','ترسلش','عامر'
          ]
          phrases = ['نقدر نعاونك','المشكل ديالك','خاصها رد','قريب بزاف','حجز جاي','الحجوزات الجاية']
          failures=[]
          arabic_range='\\u0600-\\u06FF'
          for path in Path('frontend/src').rglob('*'):
            if not path.is_file() or path.suffix not in {'.svelte','.ts','.js','.json'}:
              continue
            source=path.read_text(encoding='utf-8', errors='ignore')
            for token in tokens:
              pattern=rf'(?<![{arabic_range}]){re.escape(token)}(?![{arabic_range}])'
              if re.search(pattern, source): failures.append((path.as_posix(), token))
            for phrase in phrases:
              if phrase in source: failures.append((path.as_posix(), phrase))
          if failures:
            for item in failures: print(f'{item[0]} -> {item[1]}')
            raise SystemExit(f'{len(failures)} dialect markers remain')
          print('Modern Standard Arabic dialect-token check passed.')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src
          git commit -m "Polish remaining Arabic UI copy" || exit 0
          git push
