name: Apply pitch booking UX refactor

on:
  push:
    branches: [fix/pitch-booking-ux]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pitch-booking-ux
      - name: Apply focused UX patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          p = Path('frontend/src/routes/(app)/pitch/[id]/+page.svelte')
          s = p.read_text()
          s = rep(s,
          """  $: visibleSlots = slots.filter((slot) => {\n    const start = new Date(slot.datetime_start).getTime()\n    return start >= currentTime.getTime() - 60_000 && start < currentTime.getTime() + 24 * 60 * 60 * 1000\n  })\n  $: grouped = visibleSlots.reduce<Record<string, any[]>>((acc, slot) => {\n    const key = facilityDateKey(slot.datetime_start)\n    ;(acc[key] ??= []).push(slot)\n    return acc\n  }, {})\n  $: slotGroups = Object.keys(grouped).sort().map((date) => ({ date, slots: grouped[date] }))\n  $: activeBooking = myBookings.find((booking) => booking.status === 'scheduled' && new Date(booking.ends_at).getTime() > currentTime.getTime()) || null\n""",
          """  $: visibleSlots = slots.filter((slot) => {\n    const start = new Date(slot.datetime_start).getTime()\n    return start >= currentTime.getTime() - 60_000 && start < currentTime.getTime() + 24 * 60 * 60 * 1000\n  })\n  $: activeBooking = myBookings.find((booking) => booking.status === 'scheduled' && new Date(booking.ends_at).getTime() > currentTime.getTime()) || null\n  $: decoratedVisibleSlots = visibleSlots.map((slot) => decoratedSlot(slot))\n  $: actionableSlots = decoratedVisibleSlots.filter((slot) => slot.booked_by_me || (slot.is_available && !slot.booking_blocked))\n  $: policyBlockedSlots = decoratedVisibleSlots.filter((slot) => !slot.booked_by_me && slot.is_available && slot.booking_blocked)\n  $: policySummary = policyBlockedSlots.length > 0\n    ? [...policyBlockedSlots].sort((a, b) => Number(a.booking_eligible_at || 0) - Number(b.booking_eligible_at || 0))[0]\n    : null\n  $: grouped = actionableSlots.reduce<Record<string, any[]>>((acc, slot) => {\n    const key = facilityDateKey(slot.datetime_start)\n    ;(acc[key] ??= []).push(slot)\n    return acc\n  }, {})\n  $: slotGroups = Object.keys(grouped).sort().map((date) => ({ date, slots: grouped[date] }))\n""", 'reactive slots')
          s = rep(s,
          """    return {\n      code,\n      countdown: countdownText(eligibleAt),\n      label: ar ? `الحجز الجاي من ${labelDate}` : `Next booking from ${labelDate}`\n    }\n""",
          """    return {\n      code,\n      eligibleAt,\n      countdown: countdownText(eligibleAt),\n      label: ar ? `تقدر تحجز مرة أخرى من ${labelDate}` : `You can book again from ${labelDate}`\n    }\n""", 'policy return')
          s = rep(s,
          """      booking_block_label: block?.label || null,\n      booking_block_countdown: block?.countdown || null,\n""",
          """      booking_block_label: block?.label || null,\n      booking_block_countdown: block?.countdown || null,\n      booking_eligible_at: block?.eligibleAt || null,\n""", 'decorated eligible')

          old = """    <header class=\"mb-7\">\n      <h1 class=\"text-2xl font-extrabold tracking-[-0.035em] text-text\">{pitch.name}</h1>\n      <p class=\"mt-1 flex items-center gap-1.5 text-sm text-text-secondary\"><Icon name=\"map-pin\" size={14}/>{pitch.location || $_('bookings.unknown_location')}</p>\n      <div class=\"mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs font-semibold text-text-muted\">\n        <span>{hoursLabel()}</span>\n        {#if pitch.capacity > 1}<span>{pitch.capacity} {ar ? 'لاعبين' : 'players'}</span>{/if}\n      </div>\n    </header>\n\n    <section>\n      <div class=\"mb-4 flex items-end justify-between gap-4\">\n        <div>\n          <h2 class=\"text-lg font-bold text-text\">{ar ? 'الـ24 ساعة الجاية' : 'Next 24 hours'}</h2>\n          <p class=\"mt-1 text-xs text-text-muted\">{ar ? 'غير الأوقات اللي تقدر تحجز دابا.' : 'Only times you can act on now.'}</p>\n        </div>\n        {#if loadingSlots && slots.length > 0}<span class=\"text-xs font-semibold text-text-muted\">{ar ? 'تحديث…' : 'Refreshing…'}</span>{/if}\n      </div>\n\n      {#if loadingSlots && slots.length === 0}\n        <div class=\"space-y-3\" aria-busy=\"true\">{#each [1,2,3,4] as _}<div class=\"h-[88px] animate-pulse rounded-[16px] bg-surface-level-1\"></div>{/each}</div>\n      {:else if errorSlots && slots.length === 0}\n        <div class=\"flex items-center justify-between gap-3 py-4\"><p class=\"text-sm font-semibold text-danger\">{errorSlots}</p><button on:click={fetchSlots} class=\"min-h-10 text-sm font-bold text-primary\">{$_('common.retry')}</button></div>\n      {:else if visibleSlots.length === 0}\n        <div class=\"uneem-empty\"><p class=\"font-semibold text-text-muted\">{$_('pitch.no_slots')}</p></div>\n      {:else}\n        {#if errorSlots}<div class=\"mb-3 flex items-center justify-between gap-3 rounded-[14px] bg-danger-light px-3.5 py-3 text-sm font-semibold text-danger\"><span>{errorSlots}</span><button on:click={fetchSlots} class=\"shrink-0 font-bold\">{$_('common.retry')}</button></div>{/if}\n        <div class=\"space-y-5\">\n          {#each slotGroups as group}\n            <div>\n              <p class=\"mb-2 text-xs font-extrabold uppercase tracking-[0.08em] text-text-muted\">{groupLabel(group.date)}</p>\n              <div class=\"space-y-2\">\n                {#each group.slots as slot, i (slot.id || `${slot.datetime_start}-${i}`)}\n                  <SlotCard slotData={decoratedSlot(slot)} onBook={() => openBooking(slot)} onCancel={requestCancellation}/>\n                {/each}\n              </div>\n            </div>\n          {/each}\n        </div>\n      {/if}\n    </section>\n"""
          new = """    <header class=\"mb-5\">\n      <h1 class=\"text-[26px] font-extrabold tracking-[-0.035em] text-text\">{pitch.name}</h1>\n      <p class=\"mt-1 flex items-center gap-1.5 text-sm text-text-secondary\"><Icon name=\"map-pin\" size={14}/>{pitch.location || $_('bookings.unknown_location')}</p>\n      <div class=\"mt-2 flex flex-wrap gap-x-2 gap-y-1 text-xs font-semibold text-text-muted\">\n        <span>{hoursLabel()}</span>\n        {#if pitch.capacity > 1}<span>·</span><span>{pitch.capacity} {ar ? 'لاعبين' : 'players'}</span>{/if}\n      </div>\n    </header>\n\n    <section>\n      <div class=\"mb-3 flex items-center justify-between gap-4\">\n        <h2 class=\"text-lg font-bold text-text\">{ar ? 'الأوقات' : 'Times'}</h2>\n        {#if loadingSlots && slots.length > 0}<span class=\"text-xs font-semibold text-text-muted\">{ar ? 'تحديث…' : 'Refreshing…'}</span>{/if}\n      </div>\n\n      {#if loadingSlots && slots.length === 0}\n        <div class=\"overflow-hidden rounded-[16px] border border-border-light bg-surface\" aria-busy=\"true\">\n          {#each [1,2,3,4] as _}<div class=\"h-[64px] border-b border-border-light last:border-0\"><div class=\"m-3 h-10 animate-pulse rounded-xl bg-surface-level-1\"></div></div>{/each}\n        </div>\n      {:else if errorSlots && slots.length === 0}\n        <div class=\"flex items-center justify-between gap-3 py-4\"><p class=\"text-sm font-semibold text-danger\">{errorSlots}</p><button on:click={fetchSlots} class=\"min-h-10 text-sm font-bold text-primary\">{$_('common.retry')}</button></div>\n      {:else if visibleSlots.length === 0}\n        <div class=\"uneem-empty py-8\"><p class=\"font-semibold text-text-muted\">{$_('pitch.no_slots')}</p></div>\n      {:else}\n        {#if errorSlots}<div class=\"mb-3 flex items-center justify-between gap-3 rounded-[14px] bg-danger-light px-3.5 py-3 text-sm font-semibold text-danger\"><span>{errorSlots}</span><button on:click={fetchSlots} class=\"shrink-0 font-bold\">{$_('common.retry')}</button></div>{/if}\n\n        {#if slotGroups.length > 0}\n          <div class=\"space-y-4\">\n            {#each slotGroups as group}\n              <div>\n                <p class=\"mb-2 text-[11px] font-bold uppercase tracking-[0.08em] text-text-muted\">{groupLabel(group.date)}</p>\n                <div class=\"divide-y divide-border-light overflow-hidden rounded-[16px] border border-border-light bg-surface\">\n                  {#each group.slots as slot, i (slot.id || `${slot.datetime_start}-${i}`)}\n                    <SlotCard slotData={slot} onBook={() => openBooking(slot)} onCancel={requestCancellation}/>\n                  {/each}\n                </div>\n              </div>\n            {/each}\n          </div>\n        {/if}\n\n        {#if policySummary}\n          <div class=\"mt-4 flex items-center gap-3 rounded-[14px] bg-surface-level-1 px-3.5 py-3\">\n            <div class=\"grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-surface text-text-muted\"><Icon name=\"calendar-days\" size={17}/></div>\n            <p class=\"min-w-0 text-sm font-bold text-text\">{policySummary.booking_block_label}</p>\n          </div>\n        {:else if slotGroups.length === 0}\n          <div class=\"uneem-empty py-8\"><p class=\"font-semibold text-text-muted\">{ar ? 'ما كاين حتى وقت متاح فـ24 ساعة الجاية.' : 'No available times in the next 24 hours.'}</p></div>\n        {/if}\n      {/if}\n    </section>\n"""
          s = rep(s, old, new, 'pitch render')
          p.write_text(s)

          Path('frontend/src/lib/components/SlotCard.svelte').write_text("""<script lang=\"ts\">\n  import { _, locale } from 'svelte-i18n'\n\n  export let slotData: any\n  export let onBook: (s: any) => void\n  export let onCancel: (s: any) => void = () => {}\n\n  $: slot = slotData\n  $: bookedByMe = Boolean(slot.booked_by_me)\n  $: state = bookedByMe ? 'mine' : slot.is_available ? 'available' : 'occupied'\n  $: blocked = Boolean(slot.booking_blocked)\n  $: cancellationBlocked = Boolean(slot.cancellation_blocked)\n  $: ar = ($locale || 'en').startsWith('ar')\n\n  function formatTime(value: string) {\n    return new Intl.DateTimeFormat($locale || 'en', { timeZone: slot.timezone || 'Africa/Casablanca', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(value))\n  }\n</script>\n\n<article class=\"flex min-h-[64px] items-center gap-3 bg-surface px-3.5 py-2.5\">\n  <div class=\"min-w-0 flex-1\">\n    <div class=\"flex items-baseline gap-1.5\">\n      <span class=\"text-lg font-extrabold tracking-[-0.03em] text-text\">{formatTime(slot.datetime_start)}</span>\n      {#if slot.datetime_end}<span class=\"text-sm font-semibold text-text-muted\">– {formatTime(slot.datetime_end)}</span>{/if}\n    </div>\n    {#if state === 'mine'}<p class=\"mt-0.5 text-xs font-bold text-primary\">{ar ? 'حجزك' : 'Your booking'}</p>{/if}\n  </div>\n\n  {#if state === 'mine' && slot.booking_id && !cancellationBlocked}\n    <button on:click={() => onCancel(slot)} class=\"min-h-10 rounded-[11px] px-3 text-sm font-bold text-danger hover:bg-danger-light\">{ar ? 'إلغاء' : 'Cancel'}</button>\n  {:else if state === 'mine' && cancellationBlocked}\n    <span class=\"max-w-[108px] text-end text-xs font-bold leading-5 text-warning\">{slot.cancellation_block_label || (ar ? 'قريب بزاف' : 'Starts soon')}</span>\n  {:else if state === 'available' && !blocked}\n    <button on:click={() => onBook(slot)} class=\"min-h-10 min-w-[72px] rounded-[11px] bg-[var(--primary-action)] px-4 text-sm font-extrabold text-white hover:bg-[var(--primary-action-hover)]\">{$_('pitch.book')}</button>\n  {:else if state === 'available' && blocked}\n    <span class=\"text-xs font-semibold text-text-muted\">{ar ? 'لاحقاً' : 'Later'}</span>\n  {:else}\n    <span class=\"text-xs font-semibold text-text-muted\">{ar ? 'محجوز' : 'Booked'}</span>\n  {/if}\n</article>\n""")

          p = Path('frontend/src/lib/components/TopBar.svelte')
          s = p.read_text()
          s = rep(s, "  $: initials = ($authState.user?.full_name || 'U')\n", "  $: mobileDetailPage = $page.url.pathname.startsWith('/pitch/') || /^\\/matches\\/[^/]+/.test($page.url.pathname)\n\n  $: initials = ($authState.user?.full_name || 'U')\n", 'topbar detail flag')
          s = rep(s, '<header class="uneem-topbar sticky top-0 z-30 border-b border-border-light backdrop-blur-xl">\n', '<header class={`uneem-topbar sticky top-0 z-30 border-b border-border-light backdrop-blur-xl ${mobileDetailPage ? \'hidden lg:block\' : \'\'}`}>\n', 'topbar class')
          p.write_text(s)

          p = Path('frontend/src/routes/(app)/profile/+page.svelte')
          s = p.read_text()
          s = rep(s, "  import PwaInstallCard from '$lib/components/PwaInstallCard.svelte'\n", "  import PwaInstallCard from '$lib/components/PwaInstallCard.svelte'\n  import PasswordRequirements from '$lib/components/PasswordRequirements.svelte'\n", 'profile password import')
          s = rep(s, "  $: passwordLength = newPassword.length >= 8\n  $: passwordNumber = /\\d/.test(newPassword)\n  $: passwordSymbol = /[!@#$%^&*()\\-+]/.test(newPassword)\n  $: passwordValid = isValidPassword(newPassword)\n", "  $: passwordValid = isValidPassword(newPassword)\n", 'profile rule state')
          s = s.replace("ruleLength:'8+ أحرف', ruleNumber:'رقم', ruleSymbol:'رمز'", "ruleLength:'8 أحرف على الأقل', ruleNumberOrSymbol:'رقم أو رمز'")
          s = s.replace("ruleLength:'8+ chars', ruleNumber:'1 number', ruleSymbol:'1 symbol'", "ruleLength:'8 characters minimum', ruleNumberOrSymbol:'1 number or symbol'")
          s = rep(s, """          <div class=\"grid grid-cols-3 gap-2 px-1 text-xs font-semibold\" aria-live=\"polite\">\n            {#each [{label:copy.ruleLength,passed:passwordLength},{label:copy.ruleNumber,passed:passwordNumber},{label:copy.ruleSymbol,passed:passwordSymbol}] as rule}\n              <div class={`flex items-center gap-1.5 ${!newPassword ? 'text-text-muted' : rule.passed ? 'text-success' : 'text-danger'}`}><Icon name={rule.passed ? 'check' : 'x'} size={12}/><span>{rule.label}</span></div>\n            {/each}\n          </div>\n""", """          <PasswordRequirements password={newPassword} lengthLabel={copy.ruleLength} numberOrSymbolLabel={copy.ruleNumberOrSymbol} />\n""", 'profile rules ui')
          p.write_text(s)
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/SlotCard.svelte frontend/src/lib/components/TopBar.svelte frontend/src/routes/'(app)'/pitch/'[id]'/+page.svelte frontend/src/routes/'(app)'/profile/+page.svelte
          git commit -m "Simplify pitch booking flow and mobile detail UI" || exit 0
          git push origin HEAD:fix/pitch-booking-ux
